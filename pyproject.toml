[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oldenera-qol"
version = "0.1"
description = "A modular Windows desktop QOL assistant for Olden Era workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.9",
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pynput>=1.7",
    "pywin32>=306; platform_system == 'Windows'",
    "pydirectinput>=1.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "pyinstaller>=6.0",
]

[project.scripts]
oldenera-qol = "oldenera_qol.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=oldenera_qol --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/oldenera_qol/__main__.py",
    "src/oldenera_qol/app/*",
    "src/oldenera_qol/modules/placement_grid/panel.py",
    "src/oldenera_qol/modules/unit_library/panel.py",
    "src/oldenera_qol/modules/unit_placer/panel.py",
    "src/oldenera_qol/vision/ocr.py",
]
